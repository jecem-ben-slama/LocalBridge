name: Build LocalBridge Windows EXE

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-flutter-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install Flutter deps
        working-directory: ./localbridge_mobile
        run: flutter pub get

      - name: Build Flutter APK
        working-directory: ./localbridge_mobile
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: localbridge-android
          path: localbridge_mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  build-native-windows:
    runs-on: windows-latest

    env:
      JAVA_VERSION: "25"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Angular deps
        working-directory: ./localbridge-web
        run: npm ci

      - name: Build Angular app
        working-directory: ./localbridge-web
        run: npx ng build --configuration production

      - name: Setup GraalVM
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: "graalvm"
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify native-image is available
        shell: pwsh
        run: native-image --version

      - name: Verify static assets exist
        shell: pwsh
        run: |
          $static = Join-Path "${{ github.workspace }}" "localbridge\src\main\resources\static"
          if (!(Test-Path $static)) {
            Write-Error "Static folder missing: $static"
            exit 1
          }
          Get-ChildItem $static | Select-Object Name

      - name: Build Spring Boot native executable
        working-directory: ./localbridge
        shell: bash
        run: ./mvnw.cmd -DskipTests -Pnative clean native:compile

      - name: Write version file
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}"
          Set-Content -Path "${{ github.workspace }}\VERSION.txt" -Value $version -NoNewline

      - name: Create launcher script
        shell: pwsh
        run: |
          @'
          @echo off
          setlocal

          set "EXE=%~dp0localbridge.exe"
          set "VERFILE=%~dp0VERSION.txt"
          set "URL=http://localhost:8080"
          set "REPO=jecem-ben-slama/LocalBridge"

          if not exist "%EXE%" (
              echo ERROR: localbridge.exe was not found next to this launcher.
              echo Expected file: %EXE%
              echo Put the generated executable in the same folder as this script and try again.
              pause
              exit /b 1
          )

          set "CURRENT_VERSION=unknown"
          if exist "%VERFILE%" (
              set /p CURRENT_VERSION=<"%VERFILE%"
          )

          powershell -NoProfile -Command ^
              "try { " ^
              "  $latest = (Invoke-RestMethod -Uri 'https://api.github.com/repos/%REPO%/releases/latest' -TimeoutSec 3).tag_name; " ^
              "  if ($latest -and ($latest -ne '%CURRENT_VERSION%')) { " ^
              "    Write-Host ''; " ^
              "    Write-Host '=====================================================' -ForegroundColor Yellow; " ^
              "    Write-Host \"  A new version is available: $latest (you have %CURRENT_VERSION%)\" -ForegroundColor Yellow; " ^
              "    Write-Host \"  Download: https://github.com/%REPO%/releases/latest\" -ForegroundColor Yellow; " ^
              "    Write-Host '=====================================================' -ForegroundColor Yellow; " ^
              "    Write-Host ''; " ^
              "  } " ^
              "} catch { }"

          echo Starting LocalBridge (%CURRENT_VERSION%)...
          start "" "%EXE%" --server.port=8080

          echo Waiting for app to start on %URL%...
          for /L %%I in (1,1,120) do (
              powershell -NoProfile -Command "$c = Test-NetConnection -ComputerName localhost -Port 8080 -WarningAction SilentlyContinue; if ($c.TcpTestSucceeded) { exit 0 } else { exit 1 }" >nul 2>&1
              if not errorlevel 1 goto ready
              ping -n 2 127.0.0.1 >nul
          )

          :ready
          echo Opening browser...
          start "" "%URL%"
          exit /b 0
          '@ | Set-Content -Path "${{ github.workspace }}\start-localbridge.cmd"

      - name: Package Windows bundle
        shell: pwsh
        run: |
          $target = Join-Path "${{ github.workspace }}" "localbridge\target"
          $zipOut = Join-Path "${{ github.workspace }}" "localbridge-windows-bundle.zip"

          $exe = Get-ChildItem $target -Filter *.exe | Select-Object -First 1
          if (-not $exe) {
            Write-Error "No .exe found in localbridge/target"
            exit 1
          }

          Copy-Item $exe.FullName "${{ github.workspace }}\localbridge.exe"
          Compress-Archive -Path "${{ github.workspace }}\localbridge.exe", "${{ github.workspace }}\start-localbridge.cmd", "${{ github.workspace }}\VERSION.txt" -DestinationPath $zipOut -Force

      - name: Upload zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: localbridge-windows-bundle
          path: localbridge-windows-bundle.zip
          if-no-files-found: error

  publish-release:
    needs: [build-flutter-apk, build-native-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows bundle
        uses: actions/download-artifact@v4
        with:
          name: localbridge-windows-bundle
          path: ./release-files

      - name: Download Flutter APK
        uses: actions/download-artifact@v4
        with:
          name: localbridge-android
          path: ./release-files

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-files/localbridge-windows-bundle.zip
            release-files/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}