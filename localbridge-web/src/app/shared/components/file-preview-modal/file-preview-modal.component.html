<div *ngIf="file" class="fixed inset-0 z-50 flex items-center justify-center bg-black/80 p-4 sm:p-8"
    (click)="close.emit()">
    <section
        class="max-h-full w-full max-w-5xl overflow-hidden rounded-2xl border border-bridge-border bg-bridge-card shadow-2xl shadow-bridge-darkest/50"
        (click)="$event.stopPropagation()">
        <header class="flex items-center justify-between gap-4 border-b border-bridge-border px-4 py-3">
            <h2 class="truncate text-sm font-semibold text-bridge-text">{{ file.name }}</h2>
            <div class="flex items-center gap-2">
                <button type="button" (click)="onDownload()" [disabled]="downloadDisabled"
                    class="rounded-full bg-gradient-to-r from-bridge-primary to-bridge-accent px-3 py-1.5 text-xs font-semibold text-white shadow-lg shadow-bridge-primary/20 transition hover:brightness-110 disabled:cursor-not-allowed disabled:opacity-60">
                    Download
                </button>
                <button type="button" (click)="close.emit()" aria-label="Close preview"
                    class="px-2 py-1 text-xl text-bridge-text-secondary hover:text-bridge-text">×</button>
            </div>
        </header>

        <div class="flex h-[70vh] items-center justify-center bg-bridge-dark p-4">
            <img *ngIf="previewKind === 'image'" [src]="previewUrl" [alt]="file.name"
                class="max-h-full max-w-full object-contain" />
            <video *ngIf="previewKind === 'video'" [src]="previewUrl" controls autoplay
                class="max-h-full max-w-full"></video>
            <audio *ngIf="previewKind === 'audio'" [src]="previewUrl" controls class="w-full max-w-xl"></audio>
            <iframe *ngIf="previewKind === 'document' || previewKind === 'browser'" [src]="previewUrl"
                [title]="'Preview of ' + file.name" class="h-full w-full border-0 bg-white"></iframe>
        </div>
    </section>
</div>
