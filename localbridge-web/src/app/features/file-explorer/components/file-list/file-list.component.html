<div class="max-h-[550px] overflow-y-auto divide-y divide-bridge-border/60">
    <div *ngFor="let file of files" (click)="openNode.emit(file)"
        class="flex cursor-pointer items-center justify-between gap-2 bg-bridge-card/30 p-3 transition-colors hover:bg-bridge-elevated/50 sm:gap-3 sm:p-4">
        <div class="flex min-w-0 items-center gap-2.5 sm:gap-3.5">
            <div
                class="flex h-10 w-10 shrink-0 items-center justify-center overflow-hidden rounded-xl border border-bridge-border bg-bridge-dark shadow-sm sm:h-12 sm:w-12">
                <img *ngIf="!file.isDirectory && isImageFile(file.name)" [src]="getThumbnailUrl(file.path)"
                    [alt]="file.name" class="h-full w-full object-cover" />
                <span *ngIf="file.isDirectory || !isImageFile(file.name)" class="text-base sm:text-lg">
                    {{ file.isDirectory ? '📁' : '📄' }}
                </span>
            </div>

            <div class="min-w-0">
                <div class="truncate text-sm font-medium text-bridge-text sm:text-base">{{ file.name }}</div>
                <div
                    class="mt-0.5 text-[10px] uppercase tracking-[0.14em] text-bridge-muted-dark sm:mt-1 sm:text-[11px] sm:tracking-[0.18em]">
                    {{ file.isDirectory ? 'Folder' : 'File' }}
                </div>
            </div>
        </div>

        <div class="flex shrink-0 items-center gap-2 text-xs text-bridge-text-secondary sm:gap-4 sm:text-sm">
            <span class="hidden font-mono sm:inline">{{ file.isDirectory ? '--' : formatSize(file.size) }}</span>
            <button *ngIf="!file.isDirectory" type="button" (click)="$event.stopPropagation(); downloadFile.emit(file)"
                [disabled]="transferBusy" [attr.aria-label]="'Download ' + file.name"
                class="rounded-full border border-bridge-border bg-bridge-dark px-2.5 py-1.5 text-[10px] font-medium uppercase tracking-[0.14em] text-bridge-text-secondary transition hover:border-bridge-primary/40 hover:text-bridge-text disabled:cursor-not-allowed disabled:opacity-50 sm:px-3 sm:text-[11px] sm:tracking-[0.18em]">
                Save
            </button>
        </div>
    </div>
</div>
