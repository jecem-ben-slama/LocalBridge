<div class="space-y-4">
    <input type="file" #fileInput (change)="onFileSelected($event)" class="hidden" multiple />
    <input type="file" #phoneFileInput (change)="onFileSelected($event, 'phone')" class="hidden" multiple />

    <app-file-explorer-toolbar [title]="title" [currentPath]="currentPath" [source]="source"
        [pathHistoryLength]="pathHistory.length" [viewMode]="viewMode" [isLoading]="isLoading"
        [transferBusy]="fileService.transferBusy" [isUploading]="isUploading" [searchTerm]="searchTerm"
        [fileTypeFilter]="fileTypeFilter" (goBack)="goBack()" (selectSource)="selectSource($event)"
        (uploadToPc)="fileInput.click()" (uploadToPhone)="phoneFileInput.click()" (refresh)="refreshCurrentFolder()"
        (setViewMode)="viewMode = $event" (searchTermChange)="searchTerm = $event"
        (fileTypeFilterChange)="fileTypeFilter = $event">
    </app-file-explorer-toolbar>

    <app-file-transfer-progress *ngIf="downloadingFileName" title="Downloading" [fileName]="downloadingFileName"
        [progress]="downloadProgress" [showCancel]="true" (cancel)="fileService.cancelTransfer()">
    </app-file-transfer-progress>

    <div *ngIf="isUploading"
        class="rounded-2xl border border-bridge-border bg-bridge-card/80 p-4 shadow-sm shadow-bridge-darkest/20">
        <div class="flex items-center justify-between gap-3">
            <span class="flex items-center gap-2 text-sm font-semibold text-bridge-text">
                <span class="animate-spin text-bridge-primary">⏳</span>
                <span>Uploading files to {{ source === 'pc' ? 'PC storage' : 'phone storage' }}...</span>
            </span>
            <button (click)="fileService.cancelTransfer()"
                class="rounded-full border border-bridge-error/40 bg-bridge-error-soft px-3 py-1.5 text-[10px] font-medium uppercase tracking-[0.16em] text-bridge-error transition hover:bg-bridge-error-soft/80">
                Cancel
            </button>
        </div>

        <div class="mt-3 space-y-2">
            <div *ngFor="let entry of uploadProgressMap | keyvalue" class="space-y-1">
                <div class="flex items-center justify-between gap-3 text-xs text-bridge-text-secondary">
                    <span class="max-w-xs truncate font-mono">{{ entry.key }}</span>
                    <span class="font-mono text-bridge-accent">{{ entry.value }}%</span>
                </div>
                <div class="h-2 w-full overflow-hidden rounded-full bg-bridge-dark">
                    <div class="h-2 rounded-full bg-gradient-to-r from-bridge-primary to-bridge-accent transition-all duration-300"
                        [style.width.%]="entry.value"></div>
                </div>
            </div>
        </div>
    </div>

    <div *ngIf="errorMessage"
        class="rounded-2xl border border-bridge-error/30 bg-bridge-error-soft p-4 text-sm text-bridge-error">
        {{ errorMessage }}
    </div>

    <div *ngIf="isLoading"
        class="rounded-2xl border border-bridge-border bg-bridge-card/80 p-12 text-center text-bridge-text-secondary">
        <div class="mb-3 inline-block h-8 w-8 animate-spin rounded-full border-b-2 border-bridge-primary"></div>
        <p class="text-sm">Loading files...</p>
    </div>

    <div *ngIf="!isLoading && !errorMessage"
        class="overflow-hidden rounded-2xl border border-bridge-border bg-bridge-card/80">
        <app-file-empty-state *ngIf="filteredFiles.length === 0"></app-file-empty-state>

        <app-file-list *ngIf="filteredFiles.length > 0 && viewMode === 'list'" [files]="filteredFiles" [source]="source"
            [transferBusy]="fileService.transferBusy" (openNode)="openNode($event)"
            (downloadFile)="downloadSelectedFile($event)">
        </app-file-list>

        <app-file-grid *ngIf="filteredFiles.length > 0 && viewMode === 'grid'" [files]="filteredFiles" [source]="source"
            [transferBusy]="fileService.transferBusy" (openNode)="openNode($event)"
            (downloadFile)="downloadSelectedFile($event)">
        </app-file-grid>
    </div>
</div>

<div *ngIf="previewFile" class="fixed inset-0 z-50 flex items-center justify-center bg-black/80 p-4 sm:p-8"
    (click)="closePreview()">
    <section
        class="max-h-full w-full max-w-5xl overflow-hidden rounded-2xl border border-bridge-border bg-bridge-card shadow-2xl shadow-bridge-darkest/50"
        (click)="$event.stopPropagation()">
        <header class="flex items-center justify-between gap-4 border-b border-bridge-border px-4 py-3">
            <h2 class="truncate text-sm font-semibold text-bridge-text">{{ previewFile.name }}</h2>
            <div class="flex items-center gap-2">
                <button type="button" (click)="downloadSelectedFile(previewFile)" [disabled]="fileService.transferBusy"
                    class="rounded-full bg-gradient-to-r from-bridge-primary to-bridge-accent px-3 py-1.5 text-xs font-semibold text-white shadow-lg shadow-bridge-primary/20 transition hover:brightness-110 disabled:cursor-not-allowed disabled:opacity-60">
                    Download
                </button>
                <button type="button" (click)="closePreview()" aria-label="Close preview"
                    class="px-2 py-1 text-xl text-bridge-text-secondary hover:text-bridge-text">×</button>
            </div>
        </header>

        <div class="flex h-[70vh] items-center justify-center bg-bridge-dark p-4">
            <img *ngIf="previewKind === 'image'" [src]="previewUrl" [alt]="previewFile.name"
                class="max-h-full max-w-full object-contain" />
            <video *ngIf="previewKind === 'video'" [src]="previewUrl" controls autoplay
                class="max-h-full max-w-full"></video>
            <audio *ngIf="previewKind === 'audio'" [src]="previewUrl" controls class="w-full max-w-xl"></audio>
            <iframe *ngIf="previewKind === 'document' || previewKind === 'browser'" [src]="previewUrl"
                [title]="'Preview of ' + previewFile.name" class="h-full w-full border-0 bg-white"></iframe>
        </div>
    </section>
</div>

<div *ngIf="toastMessage" class="fixed bottom-5 right-5 z-[60] max-w-sm rounded-2xl border px-4 py-3 text-sm shadow-2xl"
    [ngClass]="{
        'border-bridge-success/40 bg-bridge-success-soft': toastType === 'success',
        'border-bridge-error/40 bg-bridge-error-soft': toastType === 'error',
        'border-bridge-border bg-bridge-card': toastType === 'info'
    }">
    {{ toastMessage }}
</div>
