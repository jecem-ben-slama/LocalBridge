<div
    class="fixed bottom-4 right-4 left-4 sm:left-auto sm:bottom-6 sm:right-6 z-[9999] flex flex-col gap-2.5 max-w-sm w-auto sm:w-full pointer-events-none">
    <div *ngFor="let toast of toastService.toasts(); trackBy: trackById"
        class="pointer-events-auto flex items-center gap-3 p-3.5 rounded-lg bg-bridge-card text-bridge-text border border-bridge-border border-l-4 shadow-2xl text-sm cursor-pointer transition-all animate-slide-in-from-top hover:border-bridge-border-strong"
        [ngClass]="{
      'border-l-bridge-success': toast.type === 'success',
      'border-l-bridge-error': toast.type === 'error',
      'border-l-bridge-warning': toast.type === 'warning',
      'border-l-bridge-info': toast.type === 'info'
    }" (click)="toastService.remove(toast.id)">
        <span class="text-base flex-shrink-0 select-none">
            {{ getIcon(toast.type) }}
        </span>

        <span class="flex-1 text-bridge-text font-medium leading-snug break-words">
            {{ toast.message }}
        </span>

        <button type="button" aria-label="Close notification"
            class="flex-shrink-0 text-bridge-muted hover:text-bridge-text hover:bg-bridge-elevated p-1 rounded text-base leading-none transition-colors"
            (click)="$event.stopPropagation(); toastService.remove(toast.id)">
            &times;
        </button>
    </div>
</div>
