<section class="space-y-5">
    <div class="flex items-center justify-between">
        <div>
            <p class="text-xs uppercase tracking-[0.18em] text-blue-400">LocalBridge folder</p>
            <h1 class="text-2xl font-bold text-white">Recently Shared</h1>
            <p class="mt-1 text-sm text-slate-400">Files shared between this PC and your phone.</p>
        </div>
        <button type="button" (click)="reload()" [disabled]="loading"
            class="rounded-lg bg-slate-800 px-3 py-2 text-sm text-slate-200 hover:bg-slate-700 disabled:opacity-50">
            {{ loading ? 'Loading...' : 'Refresh' }}
        </button>
    </div>

    <div *ngIf="error" class="rounded-lg border border-red-900 bg-red-950/40 p-4 text-sm text-red-200">
        {{ error }}
    </div>

    <div *ngIf="loading" class="rounded-xl border border-slate-800 bg-slate-900 p-12 text-center text-slate-400">
        Loading shared files...
    </div>

    <div *ngIf="!loading && !error && files.length === 0"
        class="rounded-xl border border-slate-800 bg-slate-900 p-12 text-center text-slate-500">
        No files have been shared yet.
    </div>

    <div *ngIf="!loading && !error && files.length > 0"
        class="divide-y divide-slate-800 overflow-hidden rounded-xl border border-slate-800 bg-slate-900">
        <div *ngFor="let file of files" class="flex items-center gap-4 p-4 hover:bg-slate-800/50">
            <div class="flex h-12 w-12 shrink-0 items-center justify-center overflow-hidden rounded-lg bg-slate-950">
                <img *ngIf="isImage(file)" [src]="thumbnail(file)" [alt]="file.name"
                    class="h-full w-full object-cover" />
                <span *ngIf="!isImage(file)" class="text-2xl">📄</span>
            </div>
            <div class="min-w-0 flex-1">
                <p class="truncate font-medium text-slate-100">{{ file.name }}</p>
                <p class="truncate text-xs text-slate-500">{{ file.path }}</p>
            </div>
            <button *ngIf="!file.isDirectory" type="button" (click)="download(file)"
                class="rounded-lg px-3 py-2 text-sm text-blue-300 hover:bg-blue-500/10 hover:text-blue-200">
                Save
            </button>
        </div>
    </div>
</section>
