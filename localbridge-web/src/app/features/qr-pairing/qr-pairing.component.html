<div
    class="rounded-3xl border border-bridge-border bg-gradient-to-br from-bridge-card via-bridge-card to-bridge-dark/80 p-5 shadow-lg shadow-bridge-darkest/20">
    <div class="flex items-center justify-between gap-3">
        <div>
            <p class="text-[10px] font-semibold uppercase tracking-[0.24em] text-bridge-primary">Secure pairing</p>
            <h2 class="mt-2 text-xl font-semibold text-bridge-text">Mobile device pairing</h2>
        </div>
        <span
            class="rounded-full border border-bridge-primary/30 bg-bridge-primary/10 px-2 py-1 text-[9px] font-medium uppercase tracking-[0.2em] text-bridge-primary">
            Local Wi‑Fi
        </span>
    </div>

    <div class="mt-4 grid gap-4 lg:grid-cols-[1.2fr_0.8fr]">
        <div class="space-y-4">
            <div class="rounded-2xl border border-bridge-border bg-bridge-dark/60 p-4">
                <p class="text-sm text-bridge-text-secondary">
                    Generate a secure QR code for your phone. Scan it on the same local network to connect instantly
                    without manually typing a token.
                </p>
            </div>

            <button (click)="generatePairingQr()" [disabled]="isGeneratingQr"
                class="inline-flex w-full items-center justify-center rounded-full bg-gradient-to-r from-bridge-primary to-bridge-accent px-4 py-2.5 text-sm font-semibold text-white shadow-lg shadow-bridge-primary/20 transition hover:brightness-110 disabled:cursor-not-allowed disabled:opacity-60">
                {{ isGeneratingQr ? 'Generating...' : 'Generate pairing QR' }}
            </button>

            <app-qr-pairing-steps></app-qr-pairing-steps>
        </div>

        <app-qr-pairing-card [qrCodeUrl]="qrCodeUrl" [pairingCode]="pairingCode"
            [rawPairingUrl]="rawPairingUrl"></app-qr-pairing-card>
    </div>
</div>
