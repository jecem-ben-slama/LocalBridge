<div class="bg-slate-900 border border-slate-800 rounded-xl p-6 space-y-4 max-w-xl">
    <h2 class="text-lg font-semibold text-white">Mobile Device Pairing</h2>
    <p class="text-slate-400 text-sm">
        Click below to generate a secure QR code. Scanning it with a phone on your local Wi-Fi will instantly log it in
        without typing a token.
    </p>

    <button (click)="generatePairingQr()" [disabled]="isGeneratingQr"
        class="px-4 py-2 bg-blue-600 hover:bg-blue-500 text-white font-medium rounded-lg text-sm transition-colors disabled:opacity-50">
        {{ isGeneratingQr ? 'Generating...' : 'Generate Pairing QR Code' }}
    </button>

    <!-- Render QR Code and URL when available -->
    <div *ngIf="qrCodeUrl"
        class="mt-4 p-4 bg-slate-950 border border-slate-800 rounded-lg flex flex-col items-center space-y-3">
        <img [src]="qrCodeUrl" alt="Pairing QR Code" class="w-48 h-48 bg-white p-2 rounded-lg shadow" />

        <div class="text-center space-y-1">
            <div class="text-[10px] uppercase tracking-[0.2em] text-slate-500">Pairing code</div>
            <div class="text-2xl font-bold tracking-[0.25em] text-white">{{ pairingCode }}</div>
        </div>

        <span class="text-xs text-slate-400 text-center break-all max-w-md">{{ rawPairingUrl }}</span>
    </div>
</div>
