<div class="flex flex-col gap-3 sm:gap-4 md:flex-row md:items-center md:justify-between">
    <div>
        <p
            class="text-[9px] font-semibold uppercase tracking-[0.2em] text-bridge-primary sm:text-[10px] sm:tracking-[0.24em]">
            Connections</p>
        <h1 class="mt-2 text-xl font-bold text-bridge-text sm:text-2xl">Connection status</h1>
        <p class="mt-1 text-xs text-bridge-text-secondary sm:text-sm">
            Live status of the PC session, phone connection, and phone server.
        </p>
    </div>

    <button (click)="checkNow.emit()" [disabled]="checking"
        class="inline-flex w-full items-center justify-center rounded-full border border-bridge-border bg-bridge-card px-3 py-2 text-xs font-medium text-bridge-text-secondary transition hover:border-bridge-primary/50 hover:bg-bridge-elevated hover:text-bridge-text disabled:cursor-not-allowed disabled:opacity-50 sm:w-auto md:w-auto">
        {{ checking ? 'Checking...' : 'Check now' }}
    </button>
</div>
