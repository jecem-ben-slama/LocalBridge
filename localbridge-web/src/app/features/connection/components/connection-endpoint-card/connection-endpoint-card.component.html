<div
    class="rounded-2xl border border-bridge-border bg-bridge-card/80 p-3 text-sm text-bridge-text-secondary shadow-sm shadow-bridge-darkest/20 sm:p-4">
    <div *ngIf="phoneServerUrl; else emptyState"
        class="flex flex-col gap-1.5 sm:flex-row sm:items-center sm:justify-between sm:gap-2">
        <span class="text-xs text-bridge-text-secondary sm:text-sm">Phone endpoint</span>
        <span class="min-w-0 break-all font-mono text-xs text-bridge-accent sm:text-right">{{ phoneServerUrl }}</span>
    </div>

    <ng-template #emptyState>
        <p class="text-xs text-bridge-muted-dark sm:text-sm">No phone server is registered.</p>
    </ng-template>

    <p *ngIf="lastChecked"
        class="mt-3 text-[10px] uppercase tracking-[0.14em] text-bridge-muted-dark sm:text-[11px] sm:tracking-[0.18em]">
        Last checked: {{ lastChecked | date:'medium' }}
    </p>
</div>
