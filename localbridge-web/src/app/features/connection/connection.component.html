<section class="space-y-4 sm:space-y-5">
    <app-connection-header [checking]="checking" (checkNow)="checkNow()"></app-connection-header>

    <div class="grid grid-cols-1 gap-3 sm:gap-4 lg:grid-cols-[7fr_3fr]">
        <!-- Left: QR pairing (70%) -->
        <div
            class="rounded-2xl border border-bridge-border bg-bridge-card/80 p-3 shadow-sm shadow-bridge-darkest/20 sm:p-4">
            <div class="mb-3 flex flex-wrap items-center justify-between gap-2 sm:gap-3">
                <h2 class="text-base font-semibold text-bridge-text sm:text-lg">Pair a phone</h2>
                <span
                    class="rounded-full border border-bridge-border bg-bridge-dark px-2 py-0.5 text-[9px] font-medium uppercase tracking-[0.14em] text-bridge-text-secondary sm:tracking-[0.18em]">secure</span>
            </div>
            <app-qr-pairing></app-qr-pairing>
        </div>

        <!-- Right: Device / connection status (30%) -->
        <div class="flex flex-col gap-3 sm:gap-4">
            <div class="grid grid-cols-2 gap-3 sm:gap-4 lg:grid-cols-1">
               

            <app-connection-status-card label="Phone connection" [value]="phoneConnected ? 'Connected' : 'Disconnected'"
                [badge]="phoneConnected ? 'ok' : 'wait'" [tone]="phoneConnected ? 'success' : 'warning'"
                [detail]="phoneConnected ? 'Device is paired and responsive' : 'Pairing required'">
            </app-connection-status-card>
            
            <button *ngIf="phoneConnected" type="button" (click)="disconnectPhone()" [disabled]="disconnecting"
                class="rounded-full border border-bridge-border bg-bridge-dark px-3 py-1 text-xs font-medium text-bridge-text-secondary hover:text-bridge-text disabled:opacity-50">
                {{ disconnecting ? 'Disconnecting…' : 'Disconnect phone' }}
            </button>

                <app-connection-status-card label="PC session" [value]="backendLive ? 'Reachable' : 'Unavailable'"
                    [badge]="backendLive ? 'pc' : 'down'" [tone]="backendLive ? 'success' : 'danger'"
                    detail="Local desktop session status">
                </app-connection-status-card>

                <app-connection-status-card label="Phone server" [value]="phoneServerLive ? 'Reachable' : 'Stopped'"
                    [badge]="phoneServerLive ? 'live' : 'idle'" [tone]="phoneServerLive ? 'success' : 'neutral'"
                    detail="Connected phone service health">
                </app-connection-status-card>
            </div>

            <app-connection-endpoint-card [phoneServerUrl]="phoneServerUrl"
                [lastChecked]="lastChecked"></app-connection-endpoint-card>
        </div>
    </div>
</section>
