<!-- Mobile Top Navigation Bar (Visible only on small screens) -->
<div
    class="sticky top-0 z-30 flex items-center justify-between bg-slate-900 border-b border-slate-800 px-3 py-2.5 text-white sm:px-4 sm:py-3 md:hidden">
    <div class="flex items-center space-x-2.5 sm:space-x-3">
        <div class="w-8 h-8 bg-blue-600 rounded-lg flex items-center justify-center font-bold text-white shrink-0">
            LB
        </div>
        <span class="text-base font-bold tracking-tight sm:text-lg">LocalBridge</span>
    </div>

    <button (click)="toggleMobileMenu()"
        class="p-2 rounded-lg text-slate-400 hover:text-white hover:bg-slate-800 transition-colors focus:outline-none"
        [attr.aria-expanded]="isMobileMenuOpen" aria-label="Toggle Menu">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path *ngIf="!isMobileMenuOpen" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M4 6h16M4 12h16M4 18h16"></path>
            <path *ngIf="isMobileMenuOpen" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M6 18L18 6M6 6l12 12"></path>
        </svg>
    </button>
</div>

<!-- Backdrop Overlay for Mobile Drawer -->
<div *ngIf="isMobileMenuOpen" (click)="toggleMobileMenu()"
    class="fixed inset-0 bg-black/60 z-40 md:hidden backdrop-blur-sm transition-opacity"></div>

<!-- Sidebar Container (Off-canvas drawer on mobile, persistent column on desktop) -->
<aside [class.translate-x-0]="isMobileMenuOpen" [class.-translate-x-full]="!isMobileMenuOpen"
    class="fixed inset-y-0 left-0 z-50 flex h-full w-64 max-w-[80vw] transform flex-col justify-between overflow-y-auto border-r border-slate-800 bg-slate-900 p-3 transition-transform duration-300 ease-in-out sm:w-64 sm:p-4 md:static md:max-w-none md:translate-x-0">
    <div class="space-y-5 sm:space-y-6">
        <!-- App Logo / Title (Hidden on mobile since it's in the top bar, visible on desktop) -->
        <div class="hidden md:flex items-center space-x-3 px-2 py-3">
            <div class="w-8 h-8 bg-blue-600 rounded-lg flex items-center justify-center font-bold text-white">
                LB
            </div>
            <span class="text-lg font-bold tracking-tight text-white">LocalBridge</span>
        </div>

        <!-- Nav Links -->
        <nav class="space-y-1 pt-1 md:pt-0">
            <button (click)="selectTab('files'); isMobileMenuOpen && toggleMobileMenu()"
                [class.bg-blue-600]="currentTab === 'files'" [class.text-white]="currentTab === 'files'"
                [class.text-slate-400]="currentTab !== 'files'"
                class="w-full flex items-center space-x-3 px-3 py-2.5 rounded-lg text-sm font-medium hover:bg-slate-800 hover:text-white transition-colors">
                <span>📂</span>
                <span>File Explorer</span>
            </button>

            <button (click)="selectTab('recent'); isMobileMenuOpen && toggleMobileMenu()"
                [class.bg-blue-600]="currentTab === 'recent'" [class.text-white]="currentTab === 'recent'"
                [class.text-slate-400]="currentTab !== 'recent'"
                class="w-full flex items-center space-x-3 px-3 py-2.5 rounded-lg text-sm font-medium hover:bg-slate-800 hover:text-white transition-colors">
                <span>🕘</span>
                <span>Recently Shared</span>
            </button>

            <button (click)="selectTab('connection'); isMobileMenuOpen && toggleMobileMenu()"
                [class.bg-blue-600]="currentTab === 'connection'" [class.text-white]="currentTab === 'connection'"
                [class.text-slate-400]="currentTab !== 'connection'"
                class="w-full flex items-center space-x-3 px-3 py-2.5 rounded-lg text-sm font-medium hover:bg-slate-800 hover:text-white transition-colors">
                <span>📡</span>
                <span>Connection</span>
            </button>

            <button (click)="selectTab('clipboard'); isMobileMenuOpen && toggleMobileMenu()"
                [class.bg-blue-600]="currentTab === 'clipboard'" [class.text-white]="currentTab === 'clipboard'"
                [class.text-slate-400]="currentTab !== 'clipboard'"
                class="w-full flex items-center space-x-3 px-3 py-2.5 rounded-lg text-sm font-medium hover:bg-slate-800 hover:text-white transition-colors">
                <span>📋</span>
                <span>Clipboard Sync</span>
            </button>

        </nav>
    </div>

    <!-- Bottom User / Lock Section -->
    <div class="border-t border-slate-800 pt-3 sm:pt-4">
        <button (click)="onLogout.emit()"
            class="w-full flex items-center space-x-3 px-3 py-2.5 rounded-lg text-sm font-medium text-red-400 hover:bg-red-950/40 hover:text-red-300 transition-colors">
            <span>🔒</span>
            <span>Lock Session</span>
        </button>
    </div>
</aside>
